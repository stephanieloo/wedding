<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Finally Our Turn</title>
    <style>
        :root {
            /* Chinese-inspired romantic color palette */
            --bg-color: #fdfaf7;       /* Soft warm silk cream */
            --text-color: #3a2e2b;     /* Deep charcoal/tea brown */
            --accent-color: #b83b32;   /* Elegant Chinese Red / Vermilion */
            --gold-color: #cc9933;     /* Matte gold accents */
            --card-bg: #ffffff;
            --border-color: #f3ece4;   /* Soft warm border */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* CSS REALISTIC PETAL LAYER */
        #petal-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 999;
            pointer-events: none;
            overflow: hidden;
        }

        .organic-petal {
            position: absolute;
            background: linear-gradient(135deg, #ffccd5 0%, #f3a6b4 100%);
            border-radius: 12px 1px 12px 12px; 
            opacity: 0.7;
            box-shadow: 1px 1px 3px rgba(243, 166, 180, 0.3);
            animation-name: fallAndSway;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        @keyframes fallAndSway {
            0% {
                transform: translateY(-20px) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.75; }
            90% { opacity: 0.6; }
            100% {
                transform: translateY(105vh) translateX(80px) rotate(450deg);
                opacity: 0;
            }
        }

        /* THANK YOU CARD CONTAINER */
        .container {
            position: relative;
            z-index: 1001;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 40px 30px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            box-shadow: 0 4px 15px rgba(58, 46, 43, 0.04);
        }

        .double-happiness-badge {
            font-size: 2.2rem;
            color: var(--accent-color);
            margin-bottom: 5px;
            line-height: 1;
            opacity: 0.85;
        }

        h1.names-heading {
            font-weight: 300;
            font-size: 2.2rem;
            margin-bottom: 5px;
            color: var(--accent-color);
        }

        .date {
            color: var(--gold-color);
            font-size: 1rem;
            letter-spacing: 2px;
            font-weight: 500;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        p {
            color: var(--text-color);
            font-size: 1.05rem;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            background: none;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 12px 36px;
            font-size: 0.95rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 4px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .btn:hover {
            background-color: var(--accent-color);
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div id="petal-container"></div>

    <div class="container">
        <div class="double-happiness-badge">囍</div>
        <h1 class="names-heading">Jed & Stephanie</h1>
        <div class="date">March 6, 2027</div>

        <p>Your response has been successfully submitted!</p>

        <a href="https://finallyourturn.com/" class="btn">Return Home</a>
    </div>

    <script>
        // CSS-BACKED ORGANIC PETAL GENERATOR
        function spawnPetals() {
            const container = document.getElementById('petal-container');
            const petalCount = 30; 

            for (let i = 0; i < petalCount; i++) {
                const petal = document.createElement('div');
                petal.classList.add('organic-petal');

                const size = Math.random() * 10 + 8; 
                petal.style.width = `${size}px`;
                petal.style.height = `${size + (Math.random() * 4)}px`;

                petal.style.left = `${Math.random() * 100}vw`;

                const duration = Math.random() * 4 + 6; 
                const delay = Math.random() * -10; 
                petal.style.animationDuration = `${duration}s`;
                petal.style.animationDelay = `${delay}s`;

                container.appendChild(petal);
            }
        }

        window.addEventListener('DOMContentLoaded', spawnPetals);
    </script>

</body>
</html>
